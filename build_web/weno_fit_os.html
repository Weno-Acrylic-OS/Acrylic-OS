<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Acrylic OS Simulator</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 0; background-color: #333; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
      .canvas-container { border: 2px solid white; padding: 10px; border-radius: 20px; background-color: #111; }
      canvas { border: 1px solid #555; }

      #view-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        align-items: flex-start;
      }

      /* When dual view is active, show the car container */
      .dual-view-active #car-container {
        display: block;
      }
      
      /* New IQ View Styles */
      #iq-view-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 10px;
        box-sizing: border-box;
        gap: 10px;
      }
      #iq-top-strip { height: 100px; }
      #iq-main-area {
        flex-grow: 1;
        position: relative;
      }
      #iq-ar-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 100, 200, 0.1);
      }
      #iq-console-tablet {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <h1>Acrylic OS Simulator</h1>
    <div id="view-wrapper">
        <div class="canvas-container">
          <canvas id="canvas" width="240" height="320"></canvas>
          <iframe id="react-app" style="display: none; width: 100%; height: 100%;"></iframe>
        </div>

        <!-- New container for the Car+ view -->
        <div id="car-container" class="canvas-container" style="display: none;">
            <iframe id="car-iframe" style="width: 100%; height: 100%;"></iframe>
        </div>
    </div>
    
    <!-- New container for the IQ view -->
    <div id="iq-view-container" style="display: none;">
      <div id="iq-top-strip"><iframe id="strip-iframe" width="100%" height="100%"></iframe></div>
      <div id="iq-main-area">
        <div id="iq-ar-overlay"><iframe id="ar-iframe" width="100%" height="100%"></iframe></div>
        <div id="iq-console-tablet"><iframe id="console-iframe" width="100%" height="100%"></iframe></div>
      </div>
    </div>

    <div class="controls">
      <h3>UI Personalities:</h3>
      <button onclick="setPersonality('wearable')">Wearable</button>
      <button onclick="setPersonality('desktop')">Desktop</button>
      <button onclick="setPersonality('phone')">Phone</button>
      <button onclick="setPersonality('smarthome')">Smart Home</button>
      <button onclick="setPersonality('iq')">IQ</button>
      <br/><br/>
      <button id="toggle-car-view" style="display: none;">Toggle Car View</button>
      <br/><br/>
      <button id="btn_toggle_qs">Toggle Quick Settings</button>
      <button id="btn_toggle_notifications">Toggle Notifications</button>
      <button id="btn_toggle_shortcuts">Toggle Shortcuts</button>
    </div>

    <script>
      const iframe = document.getElementById('react-app');
      let reactAppReady = false;
      let pendingPersonality = null;

      const carIframe = document.getElementById('car-iframe');
      const carContainer = document.getElementById('car-container');
      const toggleButton = document.getElementById('toggle-car-view');
      const viewWrapper = document.getElementById('view-wrapper');
      let carAppReady = false;

      const iqContainer = document.getElementById('iq-view-container');
      const stripIframe = document.getElementById('strip-iframe');
      const arIframe = document.getElementById('ar-iframe');
      const consoleIframe = document.getElementById('console-iframe');
      let iqAppsReady = { strip: false, ar: false, console: false };

      function setPersonality(personality) {
        console.log(`Shell: Setting personality to: ${personality}`);
        
        // Get containers
        const singleViewWrapper = document.getElementById('view-wrapper');
        const iqView = document.getElementById('iq-view-container');
        const canvas = document.getElementById('canvas');
        const reactIframe = document.getElementById('react-app');

        // Hide all containers by default
        singleViewWrapper.style.display = 'none';
        iqView.style.display = 'none';
        toggleButton.style.display = 'none'; // Hide car toggle button
        viewWrapper.classList.remove('dual-view-active');
        carContainer.style.display = 'none';

        if (personality === 'iq') {
            // Show IQ container and load its iframes
            iqView.style.display = 'flex';
            if (!stripIframe.src) stripIframe.src = `dashboard/index.html?personality=iq&display=strip`;
            if (!arIframe.src) arIframe.src = `dashboard/index.html?personality=iq&display=ar`;
            if (!consoleIframe.src) consoleIframe.src = `dashboard/index.html?personality=iq&display=console`;
        } else {
            // Show the standard single/dual view container
            singleViewWrapper.style.display = 'flex';
            
            if (personality === 'phone') {
                toggleButton.style.display = 'inline-block';
            }

            if (personality === 'wearable') {
                reactIframe.style.display = 'none';
                canvas.style.display = 'block';
                singleViewWrapper.querySelector('.canvas-container').style.width = '240px';
                singleViewWrapper.querySelector('.canvas-container').style.height = '320px';
            } else {
                canvas.style.display = 'none';
                reactIframe.style.display = 'block';
                
                const expectedSrc = 'dashboard/index.html';
                if (reactIframe.src.indexOf(expectedSrc) === -1) {
                    reactIframe.src = expectedSrc;
                }
                
                pendingPersonality = personality;
                if (reactAppReady) {
                    reactIframe.contentWindow.postMessage({ personality: pendingPersonality }, window.origin);
                    pendingPersonality = null;
                }
                
                if (personality === 'desktop') singleViewWrapper.querySelector('.canvas-container').style.width = '1024px', singleViewWrapper.querySelector('.canvas-container').style.height = '768px';
                else if (personality === 'phone') singleViewWrapper.querySelector('.canvas-container').style.width = '375px', singleViewWrapper.querySelector('.canvas-container').style.height = '667px';
                else if (personality === 'smarthome') singleViewWrapper.querySelector('.canvas-container').style.width = '800px', singleViewWrapper.querySelector('.canvas-container').style.height = '600px';
            }
        }
      }
    </script>

    <script type='text/javascript'>
      var lvgl_touch_x = 0;
      var lvgl_touch_y = 0;
      var lvgl_touch_down = 0;
      
      var Module = {
        canvas: (function() { return document.getElementById('canvas'); })()
      };

      Module.onRuntimeInitialized = function() {
        console.log("Shell: Emscripten runtime initialized.");
      };

      toggleButton.addEventListener('click', () => {
        const isDualActive = viewWrapper.classList.toggle('dual-view-active');
        // If the car view is now active and hasn't been loaded yet
        if (isDualActive && carIframe.src === '') {
            carIframe.src = 'dashboard/index.html';
        }
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.origin || !event.data) return;
        const data = event.data;

        // --- Logic for multiple App/Iframe "ready" signals ---
        if (data.status === 'ready') {
            // For standard single iframe
            if (event.source === iframe.contentWindow) {
                reactAppReady = true;
                if (pendingPersonality) {
                    iframe.contentWindow.postMessage({ personality: pendingPersonality }, window.origin);
                    pendingPersonality = null;
                }
            } 
            // For Car+ dual view
            else if (event.source === carIframe.contentWindow) {
                carAppReady = true;
                carIframe.contentWindow.postMessage({ personality: 'car' }, window.origin);
            }
            // For IQ triple view
            else if (event.source === stripIframe.contentWindow) iqAppsReady.strip = true;
            else if (event.source === arIframe.contentWindow) iqAppsReady.ar = true;
            else if (event.source === consoleIframe.contentWindow) iqAppsReady.console = true;
        }

        // --- Logic for Weno Car+ message forwarding ---
        if (data.type === 'weno-car-send') {
            if (carIframe && carIframe.contentWindow) {
                carIframe.contentWindow.postMessage({ type: 'weno-car-receive', message: data.message }, window.origin);
            }
        }
        
        // --- Logic for IQ message forwarding ---
        if (data.iq_sender) {
            const { iq_sender, ...message } = data;
            if (iq_sender !== 'strip' && stripIframe.contentWindow) stripIframe.contentWindow.postMessage(message, '*');
            if (iq_sender !== 'ar' && arIframe.contentWindow) arIframe.contentWindow.postMessage(message, '*');
            if (iq_sender !== 'console' && consoleIframe.contentWindow) consoleIframe.contentWindow.postMessage(message, '*');
        }

        // --- Logic for C++/WASM bridge ---
        if (data.command && Module.ccall) {
            // ... (existing logic unchanged)
        }
      });
      
      window.notifyDndChanged = (status) => {
        iframe.contentWindow.postMessage({ type: 'dnd_update', status: !!status }, window.origin);
      };

      Module.canvas.addEventListener('mousedown', (e) => { lvgl_touch_down = 1; lvgl_touch_x = e.offsetX; lvgl_touch_y = e.offsetY; });
      Module.canvas.addEventListener('mouseup', (e) => { lvgl_touch_down = 0; });
      Module.canvas.addEventListener('mousemove', (e) => { if(lvgl_touch_down) { lvgl_touch_x = e.offsetX; lvgl_touch_y = e.offsetY; } });
      Module.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      
      function weno_find_my_phone() { /* Unchanged */ }
    </script>
    <script async type="text/javascript" src="weno_fit_os.js"></script>
    <script>
        setInterval(() => {
            const healthData = { /* Unchanged */ };
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage(healthData, window.origin);
            }
        }, 5000);
    </script>
  </body>
</html>

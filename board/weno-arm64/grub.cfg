# grub.cfg for Acrylic OS with RAUC A/B support

set default="0"
set timeout="1"

# Try to load RAUC environment
if [ -s /rauc.env ] ; then
  load_env -f /rauc.env
fi

if [ "${rauc_slot}" = "A" ] ; then
  set root_slot="/dev/vda2"
  set menu_entry="Acrylic OS (Slot A)"
elif [ "${rauc_slot}" = "B" ] ; then
  set root_slot="/dev/vda3"
  set menu_entry="Acrylic OS (Slot B)"
else
  # Default fallback
  set root_slot="/dev/vda2"
  set menu_entry="Acrylic OS (Default Fallback)"
fi

menuentry "${menu_entry}" {
  linux /Image root=${root_slot} rootwait console=ttyAMA0,115200 rauc.slot=${rauc_slot}
}
